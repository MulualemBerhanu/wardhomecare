kind = "web"
previewPath = "/"
title = "ULeadRTH Public Website"
description = "A premium public-facing website for ULeadRTH, a mental health and residential supportive care organization focused on dignity, stability, growth, and independence."
version = "1.0.0"
id = "artifacts/uleadrth-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21670

[services.development]
run = "pnpm --filter @workspace/uleadrth-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/uleadrth-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/uleadrth-site/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21670"
BASE_PATH = "/"
